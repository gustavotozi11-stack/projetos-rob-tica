    <div id="root"></div>
    <script>
      (function() {
        function getTodayDate() {
          var now = new Date();
          var d = String(now.getDate()).padStart(2, '0');
          var m = String(now.getMonth() + 1).padStart(2, '0');
          var y = now.getFullYear();
          return d + '/' + m + '/' + y;
        }

        function applyDate() {
          var el = document.querySelector('.oferta-completa');
          if (el) {
            el.textContent = 'OFERTA VÁLIDA SÓ HOJE - ' + getTodayDate();
          }
        }

        setInterval(applyDate, 200);
      })();
    </script>
    <script>
      (function() {
        var done = false;

        function arrangeSections() {
          if (done) return;

          // Find first "Quero acessar agora" button
          var buttons = document.querySelectorAll('a, button');
          var targetBtn = null;
          for (var i = 0; i < buttons.length; i++) {
            if (buttons[i].textContent.trim().toLowerCase().includes('quero acessar agora')) {
              targetBtn = buttons[i];
              break;
            }
          }
          if (!targetBtn) return;

          // Find "O Que Você Vai Receber" section container
          var h2 = null;
          var allH2 = document.querySelectorAll('h2');
          for (var j = 0; j < allH2.length; j++) {
            if (allH2[j].textContent.trim() === 'O Que Você Vai Receber') {
              h2 = allH2[j];
              break;
            }
          }
          if (!h2) return;

          var receberSection = h2;
          while (receberSection && receberSection !== document.body) {
            if (receberSection.classList && receberSection.classList.contains('py-4') && receberSection.classList.contains('bg-white')) break;
            receberSection = receberSection.parentNode;
          }
          if (!receberSection || receberSection === document.body) return;

          // Get the button's parent container
          var anchor = targetBtn.closest('a') || targetBtn;
          var btnContainer = anchor.parentNode;

          // Step 1: insert "O Que Você Vai Receber" right after btnContainer
          btnContainer.parentNode.insertBefore(receberSection, btnContainer.nextSibling);

          // Step 2: build and insert "Este Kit É Ideal Para Você Que…" right after "O Que Você Vai Receber"
          var idealSection = document.createElement('div');
          idealSection.style.cssText = 'background:#fff8f0;border-radius:18px;padding:32px 28px;margin:32px auto;max-width:600px;box-shadow:0 4px 24px rgba(0,0,0,0.07);font-family:inherit;';
          idealSection.innerHTML = [
            '<h2 style="text-align:center;color:#1a1a2e;font-size:1.45rem;font-weight:800;margin-bottom:22px;line-height:1.3;">Este Kit É Ideal Para Você Que…</h2>',
            '<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px;">',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">🤖</span><span>Quer tirar os filhos das telas sem brigas e choro</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">🔧</span><span>Busca projetos prontos, rápidos e fáceis de fazer em casa</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">❤️</span><span>Deseja criar momentos de conexão real com seus filhos</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">🧠</span><span>Quer despertar a curiosidade e o lado científico da criança</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">⏰</span><span>Sente que a infância dos filhos está passando rápido demais</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">🏠</span><span>Precisa de ideias criativas que não exijam materiais caros</span></li>',
            '<li style="display:flex;align-items:flex-start;gap:12px;font-size:1rem;color:#2d2d2d;"><span style="font-size:1.4rem;">🚀</span><span>Quer ser o pai/mãe que faz os olhos das crianças brilharem</span></li>',
            '</ul>'
          ].join('');

          receberSection.parentNode.insertBefore(idealSection, receberSection.nextSibling);

          done = true;
        }

        var interval = setInterval(function() {
          arrangeSections();
          if (done) clearInterval(interval);
        }, 200);
      })();
    </script>
