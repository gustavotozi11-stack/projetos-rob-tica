      (function() {
        function applyWhiteBg() {
          // Make section backgrounds white (only large overflow-hidden containers, not buttons/badges)
          var els = document.querySelectorAll('[class]');
          for (var i = 0; i < els.length; i++) {
            var cls = els[i].className;
            if (typeof cls !== 'string') continue;
            var hasBgColor = cls.includes('from-purple-50') || cls.includes('from-gray-50') || cls.includes('from-blue-50') || cls.includes('to-purple-50') || cls.includes('to-blue-50') || cls.includes('to-orange-50') || cls.includes('from-white') || cls.includes('bg-gray-50') || cls.includes('bg-blue-50') || cls.includes('bg-purple-50') || cls.includes('bg-slate-50');
            var isSectionBg = hasBgColor && (cls.includes('py-') || cls.includes('overflow-hidden')) && !cls.includes('rounded') && !cls.includes('text-') && !cls.includes('px-12');
            if (isSectionBg) {
              els[i].style.background = 'white';
              els[i].style.backgroundImage = 'none';
            }
            // Hide decorative floating blobs
            var isBlob = cls.includes('rounded-full') && cls.includes('opacity-20') && cls.includes('absolute');

          // Reduce spacing above #combos (between "O Que Você Vai Receber" and first button)

            combos.style.paddingTop = '4px';

            if (prev) prev.style.paddingBottom = '8px';

        var bgGuard = setInterval(function() {
          applyWhiteBg();

          var h2s = document.querySelectorAll('h2');

    <script>
      // Remove seção indesejada se aparecer (via cache de versão antiga)
      (function() {
        var KILL_PHRASES = [
          'Este Kit \u00c9 Ideal Para Voc\u00ea',
          'Quer tirar os filhos das telas sem brigas',
          'Busca projetos prontos, r\u00e1pidos e f\u00e1ceis',
          'Quer ser o pai/m\u00e3e que faz os olhos',
          'Sente que a inf\u00e2ncia dos filhos'
        ];
        function containsKillPhrase(el) {
          var txt = el.textContent || '';
          for (var k = 0; k < KILL_PHRASES.length; k++) {
            if (txt.indexOf(KILL_PHRASES[k]) !== -1) return true;
          }
          return false;
        }
        function removeIdealSection() {
          var all = document.querySelectorAll('div, section');
          for (var i = 0; i < all.length; i++) {
            if (containsKillPhrase(all[i])) {
              // Walk up to remove the highest self-contained ancestor
              var target = all[i];
              while (
                target.parentNode &&
                target.parentNode.id !== 'root' &&
                containsKillPhrase(target.parentNode) &&
                target.parentNode.children.length === 1
              ) {
                target = target.parentNode;
              }
              if (target.parentNode) {
                target.style.display = 'none';
                target.remove();
              }
              return true;
            }
          }
          return false;
        }
        var guard = setInterval(function() {
          removeIdealSection();
        }, 50);
        setTimeout(function() { clearInterval(guard); }, 15000);
      })();
    </script>
    <script>
      (function() {
        function insertAcessarButton() {
          if (document.querySelector('.btn-quero-acessar')) return true;

          // Collect all proj_ images
          var imgs = document.querySelectorAll('img');
          var projImgs = [];
          for (var i = 0; i < imgs.length; i++) {
            if ((imgs[i].src || '').indexOf('proj_') !== -1) projImgs.push(imgs[i]);
          }
          if (projImgs.length === 0) return false;

          // Find the container that holds ALL proj_ images (the slides div)
          var slidesContainer = projImgs[0].parentNode;
          while (slidesContainer && slidesContainer.id !== 'root') {
            var allInside = true;
            for (var j = 0; j < projImgs.length; j++) {
              if (!slidesContainer.contains(projImgs[j])) { allInside = false; break; }
            }
            if (allInside) break;
            slidesContainer = slidesContainer.parentNode;
          }

          // DOM structure: SC (images) → P1 (1 child) → P2 (4 children: heading, slides, dots, counter) → P3 (section)
          // We need to insert AFTER P2 (inside P3), so the button appears below all carousel content including dots and counter.
          var p1 = slidesContainer.parentNode;
          var p2 = (p1 && p1.parentNode && p1.parentNode.id !== 'root') ? p1.parentNode : p1;
          var grid = p2;

          var btnWrapper = document.createElement('div');
          btnWrapper.style.cssText = 'text-align:center;padding:24px 16px 16px;background:#ffffff;';
          var btn = document.createElement('a');
          btn.className = 'btn-quero-acessar';
          btn.href = 'https://pay.lowify.com.br/checkout?product_id=FCCDs2';
          btn.target = '_blank';
          btn.rel = 'noopener noreferrer';
          btn.textContent = '🚀 QUERO ACESSAR AGORA';
          btn.style.cssText = 'display:inline-block;background:linear-gradient(135deg,#ff6b00,#ff9500);color:#fff;font-size:1.25rem;font-weight:900;padding:18px 40px;border-radius:50px;text-decoration:none;box-shadow:0 6px 24px rgba(255,107,0,0.4);letter-spacing:1px;text-transform:uppercase;transition:transform 0.15s,box-shadow 0.15s;';
          btn.onmouseover = function() { this.style.transform='scale(1.05)'; this.style.boxShadow='0 10px 32px rgba(255,107,0,0.55)'; };
          btn.onmouseout = function() { this.style.transform='scale(1)'; this.style.boxShadow='0 6px 24px rgba(255,107,0,0.4)'; };
          btn.onclick = function() {
            if (typeof window !== 'undefined' && window.fbq) {
              window.fbq('track', 'InitiateCheckout', { value: 19.99, currency: 'BRL' });
            }
          };
          btnWrapper.appendChild(btn);
          // Insert the button right after the images grid
          if (grid && grid.parentNode) {
            grid.parentNode.insertBefore(btnWrapper, grid.nextSibling);
          }
          return true;
        }
        var btnGuard = setInterval(function() {
          if (insertAcessarButton()) clearInterval(btnGuard);
        }, 100);
        setTimeout(function() { clearInterval(btnGuard); }, 15000);
      })();

    <script>
      (function() {
        function transformTestimonialsCarousel() {
          // Find testimonial images directly by src
          var allImgs = document.querySelectorAll('img');
          var testImgs = [];
          var seen = {};
          for (var i = 0; i < allImgs.length; i++) {
            var src = allImgs[i].src || '';
            if (src.indexOf('testimonial') !== -1 &&
                src.indexOf('testimonial3') === -1 &&
                src.indexOf('testimonial4') === -1 &&
                !seen[src]) {
              seen[src] = true;
              testImgs.push(src);
            }
          }
          if (testImgs.length === 0) return false;

          // Find the section wrapper via the heading
          var headings = document.querySelectorAll('h2');
          var sectionWrap = null;
          for (var h = 0; h < headings.length; h++) {
            if ((headings[h].textContent || '').indexOf('Depoimentos de quem') !== -1) {
              // Walk up to the max-w-6xl container (direct child of the section)
              var node = headings[h].parentNode;
              while (node && node.id !== 'root') {
                if ((node.className || '').indexOf('max-w-6xl') !== -1) { sectionWrap = node; break; }
                node = node.parentNode;
              }
              break;
            }
          }
          if (!sectionWrap || sectionWrap.dataset.transformed) return !!sectionWrap;
          sectionWrap.dataset.transformed = '1';

          // Keep only the heading block (first child), replace everything else
          var headingBlock = sectionWrap.firstElementChild;
          var srcs = testImgs;

          // Inject hide-scrollbar style once
          if (!document.getElementById('dep-scroll-style')) {
            var st = document.createElement('style');
            st.id = 'dep-scroll-style';
            st.textContent = '.dep-scroll::-webkit-scrollbar{display:none}';
            document.head.appendChild(st);
          }

          // Build scroll-snap carousel — same structure as the projects carousel
          var scrollEl = document.createElement('div');
          scrollEl.className = 'dep-scroll';
          scrollEl.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;';

          var track = document.createElement('div');
          track.style.cssText = 'display:flex;';

          for (var k = 0; k < srcs.length; k++) {
            var slide = document.createElement('div');
            slide.style.cssText = 'flex-shrink:0;width:100%;scroll-snap-align:start;box-sizing:border-box;padding:0 8px;text-align:center;';

            // Stars
            var stars = document.createElement('div');
            stars.style.cssText = 'display:flex;justify-content:center;gap:4px;margin-bottom:12px;';
            stars.innerHTML = '⭐⭐⭐⭐⭐';

            // Image with rounded borders
            var img = document.createElement('img');
            img.src = srcs[k];
            img.style.cssText = 'width:80%;max-width:420px;height:auto;display:block;object-fit:contain;border-radius:16px;margin:0 auto;';

            slide.appendChild(stars);
            slide.appendChild(img);
            track.appendChild(slide);
          }
          scrollEl.appendChild(track);

          // Navigation dots (same style as projects)
          var dotsRow = document.createElement('div');
          dotsRow.style.cssText = 'display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;margin-bottom:32px;';
          var dots = [];
          function updateDots(idx) {
            for (var d = 0; d < dots.length; d++) {
              dots[d].style.background = d === idx ? 'linear-gradient(135deg,#7c3aed,#2563eb)' : '#d1d5db';
              dots[d].style.transform = d === idx ? 'scale(1.3)' : 'scale(1)';
            }
          }
          for (var m = 0; m < srcs.length; m++) {
            (function(idx) {
              var dot = document.createElement('button');
              dot.style.cssText = 'width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;background:#d1d5db;padding:0;transition:all 0.2s;';
              dot.onclick = function() { scrollEl.scrollTo({ left: idx * scrollEl.offsetWidth, behavior: 'smooth' }); };
              dots.push(dot);
              dotsRow.appendChild(dot);
            })(m);
          }
          updateDots(0);
          scrollEl.addEventListener('scroll', function() {
            var idx = Math.round(scrollEl.scrollLeft / scrollEl.offsetWidth);
            updateDots(idx);
          }, { passive: true });

          // Rebuild section: heading + new carousel + dots
          sectionWrap.innerHTML = '';
          if (headingBlock) sectionWrap.appendChild(headingBlock);
          sectionWrap.appendChild(scrollEl);
          sectionWrap.appendChild(dotsRow);

          return true;
        }

        var tGuard = setInterval(function() {
          if (transformTestimonialsCarousel()) clearInterval(tGuard);
        }, 200);
        setTimeout(function() { clearInterval(tGuard); }, 15000);
      })();
    </script>

    <script>
      (function() {
        function stackGrids() {
          var done = 0;

          // 1. Stack the credentials grid (+2.500 Famílias, 🎓 Especialista, 🧠 Dedicação)
          var allEls = document.querySelectorAll('h3');
          for (var i = 0; i < allEls.length; i++) {
            if ((allEls[i].textContent || '').indexOf('+2.500') !== -1) {
              var grid = allEls[i].parentNode && allEls[i].parentNode.parentNode;
              if (grid && !grid.dataset.stacked) {
                grid.dataset.stacked = '1';
                grid.style.display = 'flex';
                grid.style.flexDirection = 'column';
                grid.style.alignItems = 'center';
                grid.style.gap = '24px';
                done++;
              }
              break;
            }
          }

          // 2. Stack the ✅ items grid in the CTA section (Entrega Imediata, Bônus Exclusivos…)
          var divs = document.querySelectorAll('div');
          for (var j = 0; j < divs.length; j++) {
            var txt = divs[j].textContent || '';
            if (txt.indexOf('✅ Entrega Imediata') !== -1 &&
                txt.indexOf('✅ Bônus Exclusivos') !== -1 &&
                txt.indexOf('✅ Garantia') !== -1 &&
                !divs[j].dataset.stacked) {
              divs[j].dataset.stacked = '1';
              divs[j].style.display = 'flex';
              divs[j].style.flexDirection = 'column';
              divs[j].style.alignItems = 'center';
              divs[j].style.gap = '12px';
              done++;
              break;
            }
          }

          // 3. Add bottom spacing to the orange CTA section
          var sections = document.querySelectorAll('div');
          for (var k = 0; k < sections.length; k++) {
            var cls = sections[k].className || '';
            if (cls.indexOf('from-orange-500') !== -1 && cls.indexOf('via-red-500') !== -1 && !sections[k].dataset.spaced) {
              sections[k].dataset.spaced = '1';
              sections[k].style.paddingBottom = '48px';
              done++;
              break;
            }
          }

          return done >= 3;
        }

        var sgGuard = setInterval(function() {
          if (stackGrids()) clearInterval(sgGuard);
        }, 150);
        setTimeout(function() { clearInterval(sgGuard); }, 15000);
      })();
    </script>
    <script>
      (function() {
        function cleanEmojis() {
          var done = 0;

          // Remove "Com amor para famílias brasileiras" by walking text nodes safely
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.indexOf('Com amor para famílias brasileiras') !== -1) {
              var target = node.parentElement;
              while (target && target !== document.body && target.parentElement && target.parentElement !== document.body && target.parentElement.children.length <= 3) {
                target = target.parentElement;
              }
              if (target && target !== document.body && target.style) {
                target.style.display = 'none';
                done++;
              }
              break;
            }
          }

          // Remove emoji from "🎓 Especialista" and "🧠 Dedicação"
          var allEls = document.querySelectorAll('*');
          for (var i = 0; i < allEls.length; i++) {
            var el = allEls[i];
            var elTxt = (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3) ? el.textContent : '';
            if (elTxt === '🎓 Especialista') { el.textContent = 'Especialista'; done++; }
            if (elTxt === '🧠 Dedicação') { el.textContent = 'Dedicação'; done++; }
          }

          return done >= 3;
        }

        var ceGuard = setInterval(function() {
          if (cleanEmojis()) clearInterval(ceGuard);
        }, 150);
        setTimeout(function() { clearInterval(ceGuard); }, 15000);
      })();
    </script>

        function addAnaSilvaSpacing() {
          var headings = document.querySelectorAll('h2');
          for (var i = 0; i < headings.length; i++) {
            if ((headings[i].textContent || '').indexOf('Prof. Ana Silva') !== -1) {
              // Walk up to find the section-level container
              var section = headings[i].parentNode;
              while (section && section.id !== 'root') {
                var par = section.parentNode;
                if (!par || par.id === 'root') break;
                if (par.children.length >= 2) break;
                section = par;
              }
              if (section && !section.dataset.anaSpaced) {
                section.dataset.anaSpaced = '1';
                section.style.paddingBottom = '1px';
              }
              return true;
            }
          }
          return false;
        }
        var asGuard = setInterval(function() {
          if (addAnaSilvaSpacing()) clearInterval(asGuard);
        }, 150);
        setTimeout(function() { clearInterval(asGuard); }, 15000);
      })();
    </script>

    <script>
      (function() {
        function moveTestimonialsAfterBonus() {
          var bonusSection = document.getElementById('bonus-section');
          if (!bonusSection) return false;

          // Wait for the testimonials carousel to be built (dep-scroll class)
          var carousel = document.querySelector('.dep-scroll');
          if (!carousel) return false;

          // Find the full section that contains the carousel — walk up to a
          // direct child of the layout root (same level as bonusSection)
          var target = carousel;
          var bsParent = bonusSection.parentNode;
          while (target && target.parentNode && target.parentNode !== bsParent) {
            target = target.parentNode;
          }
          if (!target || target.parentNode !== bsParent) return false;
          if (target === bonusSection.nextSibling) return true;

          // Move entire testimonials section right after the bonus section
          bsParent.insertBefore(target, bonusSection.nextSibling);
          return true;
        }

        var mtGuard = setInterval(function() {
          if (moveTestimonialsAfterBonus()) clearInterval(mtGuard);
        }, 200);
        setTimeout(function() { clearInterval(mtGuard); }, 15000);
      })();
    </script>
