    <script>
      (function() {
        function applyWhiteBg() {
          // Make section backgrounds white (only large overflow-hidden containers, not buttons/badges)
          var els = document.querySelectorAll('[class]');
          for (var i = 0; i < els.length; i++) {
            var cls = els[i].className;
            if (typeof cls !== 'string') continue;
            var isSectionBg = (cls.includes('from-purple-50') || cls.includes('from-gray-50') || cls.includes('from-blue-50') || cls.includes('to-purple-50') || cls.includes('to-blue-50') || cls.includes('to-orange-50')) && cls.includes('overflow-hidden');
            if (isSectionBg) {
              els[i].style.background = 'white';
              els[i].style.backgroundImage = 'none';
            }
            // Hide decorative floating blobs
            var isBlob = cls.includes('rounded-full') && cls.includes('opacity-20') && cls.includes('absolute');
            if (isBlob) els[i].style.display = 'none';
          }

          // Reduce spacing above #combos (between "O Que Você Vai Receber" and first button)
          var combos = document.getElementById('combos');
          if (combos) {
            combos.style.paddingTop = '4px';
            var prev = combos.previousElementSibling;
            if (prev) prev.style.paddingBottom = '8px';
          }
        }

        var bgGuard = setInterval(function() {
          applyWhiteBg();
        }, 150);
        setTimeout(function() { clearInterval(bgGuard); }, 15000);
      })();
    </script>
    <script>
      (function() {
        var ITEM_ICONS = {
          'Vídeo passo a passo': { icon: '🎬', color: '#ef4444' },
          'crianças de 4 a 12': { icon: '👧', color: '#f97316' },
          'celular, tablet':     { icon: '📱', color: '#3b82f6' },
          'vitalício':           { icon: '♾️', color: '#8b5cf6' },
          'WhatsApp':            { icon: '💬', color: '#22c55e' },
          'E-mail':              { icon: '✉️', color: '#0ea5e9' }
        };

        function enhanceMaterialSection() {
          // Find the h3 title
          var h3 = null;
          var all = document.querySelectorAll('h3');
          for (var i = 0; i < all.length; i++) {
            if (all[i].textContent.indexOf('Material Completo em Vídeo') !== -1) {
              h3 = all[i]; break;
            }
          }
          if (!h3) return false;
          // Walk up to find the card container (the one with background:#f8fafc)
          var card = h3.parentNode;
          while (card && !card.style.background && card.id !== 'root') card = card.parentNode;
          if (!card || card.id === 'root') { card = h3.parentNode; }

          if (card.dataset.enhanced) return true;
          card.dataset.enhanced = '1';

          // Style the card
          card.style.background = 'linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%)';
          card.style.borderRadius = '20px';
          card.style.boxShadow = '0 8px 32px rgba(59,130,246,0.10)';
          card.style.border = '1.5px solid #bfdbfe';
          card.style.padding = '24px 20px 20px';
          card.style.margin = '8px 0';

          // Add a visual header badge
          var badge = document.createElement('div');
          badge.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;';
          badge.innerHTML = '<span style="font-size:2rem;">🤖</span><span style="background:linear-gradient(90deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.1rem;font-weight:900;letter-spacing:0.5px;">TUDO QUE VOCÊ RECEBE</span><span style="font-size:2rem;">🚀</span>';
          card.insertBefore(badge, card.firstChild);

          // Enhance each checklist item
          var items = card.querySelectorAll('div');
          for (var j = 0; j < items.length; j++) {
            var item = items[j];
            var txt = item.textContent || '';
            var matched = null;
            for (var key in ITEM_ICONS) {
              if (txt.indexOf(key) !== -1) { matched = ITEM_ICONS[key]; break; }
            }
            if (!matched) continue;
            if (item.dataset.vis) continue;
            item.dataset.vis = '1';
            // Style the row
            item.style.background = 'white';
            item.style.borderRadius = '12px';
            item.style.padding = '10px 14px';
            item.style.marginBottom = '8px';
            item.style.boxShadow = '0 2px 8px rgba(0,0,0,0.06)';
            item.style.border = '1px solid #f1f5f9';
            item.style.display = 'flex';
            item.style.alignItems = 'center';
            item.style.gap = '12px';
            // Add colored icon pill before the ✅
            var pill = document.createElement('span');
            pill.textContent = matched.icon;
            pill.style.cssText = 'font-size:1.4rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:' + matched.color + '18;flex-shrink:0;';
            item.insertBefore(pill, item.firstChild);
          }
          return true;
        }

        var visGuard = setInterval(function() {
          if (enhanceMaterialSection()) clearInterval(visGuard);
        }, 150);
        setTimeout(function() { clearInterval(visGuard); }, 15000);
      })();
    </script>
    <script>
      // Remove seção indesejada se aparecer (via cache de versão antiga)
      (function() {
        var KILL_PHRASES = [
          'Este Kit \u00c9 Ideal Para Voc\u00ea',
          'Quer tirar os filhos das telas sem brigas',
          'Busca projetos prontos, r\u00e1pidos e f\u00e1ceis',
          'Quer ser o pai/m\u00e3e que faz os olhos',
          'Sente que a inf\u00e2ncia dos filhos'
        ];
        function containsKillPhrase(el) {
          var txt = el.textContent || '';
          for (var k = 0; k < KILL_PHRASES.length; k++) {
            if (txt.indexOf(KILL_PHRASES[k]) !== -1) return true;
          }
          return false;
        }
        function removeIdealSection() {
          var all = document.querySelectorAll('div, section');
          for (var i = 0; i < all.length; i++) {
            if (containsKillPhrase(all[i])) {
              // Walk up to remove the highest self-contained ancestor
              var target = all[i];
              while (
                target.parentNode &&
                target.parentNode.id !== 'root' &&
                containsKillPhrase(target.parentNode) &&
                target.parentNode.children.length === 1
              ) {
                target = target.parentNode;
              }
              if (target.parentNode) {
                target.style.display = 'none';
                target.remove();
              }
              return true;
            }
          }
          return false;
        }
        var guard = setInterval(function() {
          removeIdealSection();
        }, 50);
        setTimeout(function() { clearInterval(guard); }, 15000);
      })();
    </script>
    <script>
      (function() {
        function insertAcessarButton() {
          if (document.querySelector('.btn-quero-acessar')) return true;
          // Find the leaf <p> with "ALGUNS DOS PROJETOS"
          var leaf = null;
          var candidates = document.querySelectorAll('p, span, h2, h3, h4');
          for (var i = 0; i < candidates.length; i++) {
            if ((candidates[i].textContent || '').indexOf('ALGUNS DOS PROJETOS') !== -1) {
              leaf = candidates[i];
              break;
            }
          }
          if (!leaf) return false;
          // Walk up to find the section-level container (stops when parent has id=root or has many direct children)
          var section = leaf.parentNode;
          while (section && section.id !== 'root') {
            var par = section.parentNode;
            if (!par || par.id === 'root') break;
            // Stop walking up when the parent has multiple siblings (i.e., section is a top-level block)
            if (par.children.length >= 3) break;
            section = par;
          }
          var btnWrapper = document.createElement('div');
          btnWrapper.style.cssText = 'text-align:center;padding:24px 16px 16px;';
          var btn = document.createElement('a');
          btn.className = 'btn-quero-acessar';
          btn.href = 'https://pay.lowify.com.br/checkout?product_id=FCCDs2';
          btn.target = '_blank';
          btn.rel = 'noopener noreferrer';
          btn.textContent = '🚀 QUERO ACESSAR AGORA';
          btn.style.cssText = 'display:inline-block;background:linear-gradient(135deg,#ff6b00,#ff9500);color:#fff;font-size:1.25rem;font-weight:900;padding:18px 40px;border-radius:50px;text-decoration:none;box-shadow:0 6px 24px rgba(255,107,0,0.4);letter-spacing:1px;text-transform:uppercase;transition:transform 0.15s,box-shadow 0.15s;';
          btn.onmouseover = function() { this.style.transform='scale(1.05)'; this.style.boxShadow='0 10px 32px rgba(255,107,0,0.55)'; };
          btn.onmouseout = function() { this.style.transform='scale(1)'; this.style.boxShadow='0 6px 24px rgba(255,107,0,0.4)'; };
          btn.onclick = function() {
            if (typeof window !== 'undefined' && window.fbq) {
              window.fbq('track', 'InitiateCheckout', { value: 19.99, currency: 'BRL' });
            }
          };
          btnWrapper.appendChild(btn);
          // Insert the button after the section container
          if (section && section.parentNode) {
            section.parentNode.insertBefore(btnWrapper, section.nextSibling);
          }
          return true;
        }
        var btnGuard = setInterval(function() {
          if (insertAcessarButton()) clearInterval(btnGuard);
        }, 100);
        setTimeout(function() { clearInterval(btnGuard); }, 15000);
      })();
    </script>
    <script>
      (function() {
        function getTodayDate() {
          var now = new Date();
          var d = String(now.getDate()).padStart(2, '0');
          var m = String(now.getMonth() + 1).padStart(2, '0');
          var y = now.getFullYear();
          return d + '/' + m + '/' + y;
        }

        function applyDate() {
          var el = document.querySelector('.oferta-completa');
          if (el) {
            el.textContent = 'OFERTA VÁLIDA SÓ HOJE - ' + getTodayDate();
          }
        }

        setInterval(applyDate, 200);
      })();
    </script>
